name: Log weather forecast (Open-Meteo and MET Malaysia)

# Every 6 hours, about an hour after the 00/06/12/18 UTC weather-model runs
# appear. Stores the 3-day rain forecast for every river station in Supabase
# (supabase/weather.sql) and updates weather_outlook, which the app reads.
# The daily archive job (archive_jps.yml) saves finished days to data/forecast/.
on:
  schedule:
    - cron: '41 1,7,13,19 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: log-weather
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: logger
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: logger/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m jps_logger.weather collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
