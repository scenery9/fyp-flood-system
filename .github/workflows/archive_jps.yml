name: Archive JPS readings

# Daily at 03:13 Malaysia time (19:13 UTC).
# 1. Saves every finished day from Supabase to data/YYYY/MM/YYYY-MM-DD.csv.gz
# 2. Commits and pushes those files (this also keeps the repository "active",
#    so GitHub does not switch off the 15-minute logger after 60 quiet days)
# 3. Only then deletes archived days older than 30 days from Supabase
# 4. Checks the database size: warning at 300 MB, failure at 400 MB
# If any step fails, the later steps do not run, so nothing is deleted unarchived.
on:
  schedule:
    - cron: '13 19 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: archive-jps
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: logger/requirements.txt
      - run: pip install -r logger/requirements.txt
      - name: Save finished days to data/
        working-directory: logger
        run: python -m jps_logger.archive archive
      - name: Commit and push the archive files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new archive files"
          else
            git commit -m "Archive JPS readings ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi
      - name: Remove archived days older than 30 days from Supabase
        working-directory: logger
        run: python -m jps_logger.archive cleanup
      - name: Check database size
        working-directory: logger
        run: python -m jps_logger.archive check-size
