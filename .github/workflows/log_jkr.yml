name: Log JKR disaster incidents (bencana.jkr.gov.my)

# Every hour. Reads the current incidents on JKR's public portal (floods,
# landslides, road collapses), with the nearest JPS river stations and rain gauges
# and their readings, into Supabase (supabase/jkr.sql). The weather job
# (log_weather.yml) also forecasts the rain at these places, and the daily archive
# job (archive_jps.yml) saves finished days to data/incidents/.
# The portal is slow (up to about a minute per page), hence the long timeout.
on:
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: log-jkr
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: logger
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: logger/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m jps_logger.jkr collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
