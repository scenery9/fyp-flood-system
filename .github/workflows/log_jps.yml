name: Log JPS Selangor and Melaka readings

# Every 15 minutes, at minutes 7, 22, 37 and 52 (quieter than :00 on GitHub).
# Supabase pg_cron starts it through workflow_dispatch (supabase/logger_schedule.sql),
# because GitHub's own schedule is best-effort: on 19 Nov 2026 it ran only every
# 5-8 hours. The schedule below stays as a backup. GitHub also turns scheduled runs
# off after 60 days without a commit (workflow_dispatch keeps working).
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: log-jps
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: logger
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: logger/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m jps_logger.collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
